server {
    listen 3000;
    listen 3443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # API proxy -> backend
    location /api/ {
        proxy_pass http://backend:5001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 20M;
    }

    # WebSocket proxy -> backend
    location /ws/ {
        proxy_pass http://backend:5001/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Static file proxies -> backend (^~ prevents regex locations from overriding)
    location ^~ /avatars/ {
        proxy_pass http://backend:5001/avatars/;
    }

    location ^~ /snapshots/ {
        proxy_pass http://backend:5001/snapshots/;
    }

    # WHIP/WHEP proxy -> MediaMTX
    location ~ ^.*(whip|whep).* {
        proxy_pass http://mediamtx:8889;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        client_max_body_size 10M;
    }

    # SPA fallback — serve index.html for all frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|wasm|tflite)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
