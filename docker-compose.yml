version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securesight_api
    ports:
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - recognition-data:/app/data
    environment:
      - DB_PATH=/app/data/recognition.db
      - AVATARS_DIR=avatars
      - SNAPSHOTS_DIR=snapshots

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securesight_web
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:5001
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

volumes:
  recognition-data:
