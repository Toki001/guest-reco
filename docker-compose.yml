services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securesight_api
    ports:
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - recognition-data:/app/data
      - avatars-data:/app/avatars
      - snapshots-data:/app/snapshots
      - model-cache:/root/.insightface
    environment:
      - DB_PATH=/app/data/recognition.db
      - AVATARS_DIR=/app/avatars
      - SNAPSHOTS_DIR=/app/snapshots
      - CORS_ORIGINS=*
      - JWT_SECRET=${JWT_SECRET:-}
      - CAMERA_API_KEY=${CAMERA_API_KEY:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-securesight2026}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securesight_web
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: securesight_mediamtx
    ports:
      - "8889:8889"
      - "8189:8189/udp"
      - "9997:9997"
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

volumes:
  recognition-data:
  avatars-data:
  snapshots-data:
  model-cache:
